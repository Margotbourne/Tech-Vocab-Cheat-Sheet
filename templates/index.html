<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTerm Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Small helper style for your navigation link */
        .nav-links { list-style: none; padding: 0; margin-bottom: 2rem; }
        .add-link { display: inline-block; background-color: #3b82f6; color: #fff; padding: 0.6rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
        .add-link:hover { background-color: #2563eb; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Tracker Jacker</h1>
        <p class="subtitle">Tech Vocab Cheat Sheet</p>

        <ul class="nav-links">
            <li><a href="/add" class="add-link">➕ Add Term</a></li>
        </ul>
        
        <div class="flashcard-grid">
            {% for term in terms %}
                <div class="flashcard">
                    <span class="tag">{{ term.topic }}</span>
                    <h2>{{ term.concept_name }}</h2>
                    
                    <div class="section">
                        <h3>The Analogy</h3>
                        <p>{{ term.analogy }}</p>
                    </div>
                    
                    <div class="section">
                        <h3>Key Notes</h3>
                        <p>{{ term.key_notes }}</p>
                    </div>

                    <div class="card-footer">
                        <a href="/term/{{ term.id }}" class="notes-link">Read Full Study Notes →</a>
                    </div>
                </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
